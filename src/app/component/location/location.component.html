<div class="container">

  <!-- FORMULAIRE LOCATION -->
  <div class="mt-5">
    <div class="card shadow-lg">
      <div class="card-body">

        <form [formGroup]="locationForm" (ngSubmit)="submitLocationForm()">

          <div class="row g-3">

            <!-- Montant total de la location -->
            <div class="col-12 col-md-4">
              <label class="form-label">Montant total de la location</label>

              <div class="form-control bg-light fw-bold text-success">
                {{ getMontantTotal() | number:'1.0-2' }} $
              </div>
            </div>

            <!-- LISTE DES PANNEAUX DE LA LOCATION -->
            <div formArrayName="locationPanneaux" class="mt-4">

              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5>Panneaux à louer</h5>

                <button
                  type="button"
                  class="btn btn-outline-primary"
                  (click)="addLocationPanneau()">
                  <i class="fa fa-plus"></i> Ajouter un panneau
                </button>
              </div>

              <div
                *ngFor="let panneauForm of locationPanneaux.controls; let i = index"
                [formGroupName]="i"
                class="card mb-3">

                <div class="card-header d-flex justify-content-between align-items-center">
                  <strong>Panneau {{ i + 1 }}</strong>

                  <button
                    type="button"
                    class="btn btn-sm btn-outline-danger"
                    (click)="removeLocationPanneau(i)">
                    <i class="fa fa-trash"></i> Retirer
                  </button>
                </div>

                <div class="card-body">
                  <div class="row g-3">

                    <!-- Panneau -->
                    <div class="col-12 col-md-6">
                      <label class="form-label">Panneau *</label>

                      <select
                        class="form-select"
                        formControlName="idPanneau"
                        [class.is-invalid]="isLocationPanneauInvalid(i, 'idPanneau')">

                        <option value="">Sélectionner un panneau</option>

                        <option *ngFor="let p of panneaux" [ngValue]="p.id">
                          {{ p.emplacement }}
                        </option>

                      </select>

                      <small class="text-danger"
                             *ngIf="hasLocationPanneauError(i, 'idPanneau', 'required')">
                        Le panneau est obligatoire.
                      </small>
                    </div>

                    <!-- Date début -->
                    <div class="col-12 col-md-6">
                      <label class="form-label">Date début location *</label>

                      <input
                        type="date"
                        class="form-control"
                        formControlName="dateDebut"
                        [class.is-invalid]="isLocationPanneauInvalid(i, 'dateDebut')">

                      <small class="text-danger"
                             *ngIf="hasLocationPanneauError(i, 'dateDebut', 'required')">
                        La date de début est obligatoire.
                      </small>
                    </div>

                    <!-- Date fin -->
                    <div class="col-12 col-md-6">
                      <label class="form-label">Date fin location *</label>

                      <input
                        type="date"
                        class="form-control"
                        formControlName="dateFin"
                        [class.is-invalid]="isLocationPanneauInvalid(i, 'dateFin')">

                      <small class="text-danger"
                             *ngIf="hasLocationPanneauError(i, 'dateFin', 'required')">
                        La date de fin est obligatoire.
                      </small>
                    </div>

                    <!-- Montant ligne -->
                    <div class="col-12 col-md-6">
                      <label class="form-label">Montant ligne *</label>

                      <input
                        type="number"
                        class="form-control"
                        formControlName="montantLigne"
                        [class.is-invalid]="isLocationPanneauInvalid(i, 'montantLigne')">

                      <small class="text-danger"
                             *ngIf="hasLocationPanneauError(i, 'montantLigne', 'required')">
                        Le montant de la ligne est obligatoire.
                      </small>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="text-danger mt-3"><small>Les champs avec * sont obligatoires.</small></div>

          <div class="d-flex gap-2 justify-content-end mt-3">

            <button type="button"
                    class="btn btn-outline-secondary"
                    (click)="home()">
              <i class="fa fa-home me-1"></i>
              Accueil
            </button>

            <button type="submit"
                    class="btn btn-success px-4"
                    [disabled]="locationForm.invalid">
              <i class="fa fa-save me-1"></i>
              Enregistrer
            </button>

          </div>

        </form>
      </div>
    </div>
  </div>
</div>
