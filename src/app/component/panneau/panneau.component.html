<div class="container">

  <!-- FORMULAIRE PANNEAU -->
  <div class="marge-haut">
    <div class="card shadow-lg">
      <div class="card-body">

        <form [formGroup]="panneauForm" (ngSubmit)="submitPanneauForm()">

          <div class="row g-3">

            <!-- Emplacement -->
            <div class="col-12 col-md-4">
              <label for="emplacement" class="form-label">Emplacement *</label>
              <input id="emplacement" class="form-control" formControlName="emplacement" [class.is-invalid]="isInvalid('emplacement')">
              <small class="text-danger" *ngIf="hasError('emplacement', 'required')">L'emplacement du panneau est obligatoire.</small>
            </div>

            <!-- Proprietaire -->
            <div class="col-12 col-md-4">
              <label for="idProprietaire" class="form-label">Proprietaire *</label>
              <select id="idProprietaire" class="form-select" formControlName="idProprietaire" [class.is-invalid]="isInvalid('idProprietaire')">
                <option value="">Sélectionner un propriétaire</option>
                <option *ngFor="let p of proprietaires" [ngValue]="p.id">
                  {{ p.user.nom }} {{ p.user.prenom }}
                </option>
              </select>
              <small class="text-danger" *ngIf="hasError('idProprietaire', 'required')">Le propriétaire du panneau est obligatoire.</small>
            </div>

          </div>

          <div class="text-danger mt-3"><small>Les champs avec * sont obligatoires.</small></div>

          <div class="mt-3">
            <button type="submit" class="btn btn-outline-success" [disabled]="panneauForm.invalid">Enregistrer</button>
            <button type="button" class="btn btn-outline-danger ms-3" (click)="home()">Accueil</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- RECHERCHE -->
  <div class="mt-5">
    <div class="mb-3 col-12 col-md-6 col-lg-4">
      <input type="text" class="form-control"
             placeholder="Rechercher un panneau..."
             [(ngModel)]="searchTerm">
    </div>

    <!-- TABLEAU -->
    <div class="table-responsive shadow-lg p-3 rounded-2">
      <table class="table table-bordered table-striped align-middle">

        <thead>
        <tr>
          <th>N°</th>
          <th>Emplacement</th>
          <th (click)="sortBy('nom')" role="button">Nom & Prénom</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let p of panneaux | userFilter:searchTerm |
          paginate: { itemsPerPage: pageSize, currentPage: page, totalItems: count }">

          <td>{{ p.idPanneau }}</td>
          <td>{{ p.proprietaire.user.nom }} {{ p.proprietaire.user.prenom }}</td>

          <td>
            <div class="d-flex gap-2">

              <button class="btn btn-primary btn-sm"
                      *ngIf="hasRoleService.hasAnyRole(['ADMIN'], userRole)"
                      (click)="update(p.id)">
                <i class="fa fa-edit"></i>
              </button>

              <button class="btn btn-danger btn-sm"
                      *ngIf="hasRoleService.hasAnyRole(['SUPER-ADMIN'], userRole)"
                      (click)="desactiver(p.id, p)">
                <i class="fa fa-trash"></i>
              </button>

            </div>
          </td>

        </tr>
        </tbody>
      </table>

      <div class="text-center mt-3">
        <pagination-controls
          previousLabel="Précédent"
          nextLabel="Suivant"
          [responsive]="true"
          (pageChange)="handlePageChange($event)">
        </pagination-controls>
      </div>

    </div>
  </div>
</div>
