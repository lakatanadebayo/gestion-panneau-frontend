<div class="container">

  <!-- RECHERCHE -->
  <div class="mt-5">
    <div class="mb-3 col-12 col-md-6 col-lg-4">
      <input type="text" class="form-control"
             placeholder="Rechercher un panneau..."
             [(ngModel)]="searchTerm">
    </div>

    <!-- TABLEAU -->
    <div class="table-responsive shadow-lg p-3 rounded-2">
      <table class="table table-bordered table-striped align-middle">

        <thead>
        <tr>
          <th>N°</th>
          <th>Adresse</th>
          <th>Ville</th>
          <th>Pays</th>
          <th (click)="sortBy('nom')" role="button">Propriétaire</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let p of panneaux | userFilter:searchTerm |
          paginate: { itemsPerPage: pageSize, currentPage: page, totalItems: count }">

          <td>{{ p.idPanneau }}</td>
          <td>{{ p.adresse }}</td>
          <td>{{ p.ville }}</td>
          <td>{{ p.pays.nom }}</td>
          <td>{{ p.proprietaire.user.nom }} {{ p.proprietaire.user.prenom }}</td>

          <td>
            <div class="d-flex gap-2">

              <button class="btn btn-primary btn-sm"
                      *ngIf="hasRoleService.hasAnyRole(['ADMIN'], userRole)"
                      (click)="update(p.id)">
                <i class="fa fa-edit"></i>
              </button>

              <button class="btn btn-danger btn-sm"
                      *ngIf="hasRoleService.hasAnyRole(['SUPER-ADMIN'], userRole)"
                      (click)="desactiver(p.id, p)">
                <i class="fa fa-trash"></i>
              </button>

            </div>
          </td>

        </tr>
        </tbody>
      </table>

      <div class="text-center mt-3">
        <pagination-controls
          previousLabel="Précédent"
          nextLabel="Suivant"
          [responsive]="true"
          (pageChange)="handlePageChange($event)">
        </pagination-controls>
      </div>

    </div>
  </div>
</div>
