<div class="container">

  <!-- FORMULAIRE PANNEAU -->
  <div class="mt-5">
    <div class="card shadow-lg">
      <div class="card-body">

        <form [formGroup]="panneauForm" (ngSubmit)="submitPanneauForm()">

          <div class="row g-3">

            <!-- Adresse -->
            <div class="col-12 col-md-4">
              <label for="adresse" class="form-label">Adresse *</label>
              <input id="adresse" class="form-control" formControlName="adresse" [class.is-invalid]="isInvalid('emplacement')">
              <small class="text-danger" *ngIf="hasError('adresse', 'required')">L'adresse du panneau est obligatoire.</small>
            </div>

            <!-- Ville -->
            <div class="col-12 col-md-4">
              <label for="ville" class="form-label">Ville *</label>
              <input id="ville" class="form-control" formControlName="ville" [class.is-invalid]="isInvalid('emplacement')">
              <small class="text-danger" *ngIf="hasError('ville', 'required')">La ville du panneau est obligatoire.</small>
            </div>

            <!-- Pays -->
            <div class="col-12 col-md-6">
              <label for="idPays" class="form-label">Pays *</label>
              <select id="idPays" class="form-select"
                      formControlName="idPays"
                      [class.is-invalid]="isInvalid('idPays')">
                <option value="">Sélectionner un pays</option>
                <option *ngFor="let p of pays" [ngValue]="p.id">
                  {{ p.nom }}
                </option>
              </select>
              <small class="text-danger"
                     *ngIf="hasError('idPays', 'required')">
                Le pays est obligatoire.
              </small>
            </div>

          </div>

          <div class="text-danger mt-3"><small>Les champs avec * sont obligatoires.</small></div>

          <div class="d-flex gap-2 justify-content-end mt-3">

            <button type="button"
                    class="btn btn-outline-secondary"
                    (click)="home()">
              <i class="fa fa-home me-1"></i>
              Accueil
            </button>

            <button type="submit"
                    class="btn btn-success px-4"
                    [disabled]="panneauForm.invalid">
              <i class="fa fa-save me-1"></i>
              Enregistrer
            </button>

          </div>

        </form>
      </div>
    </div>
  </div>
</div>
